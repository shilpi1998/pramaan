<template>
    <lightning-card title="Governance Hub" icon-name="standard:dashboard">
        <div slot="actions">
            <lightning-button label="Refresh" icon-name="utility:refresh" onclick={handleRefresh}></lightning-button>
        </div>

        <div class="slds-p-around_medium">
            <!-- Stats Row -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-5">
                    <div class="stat-card draft">
                        <div class="stat-number">{stats.draft}</div>
                        <div class="stat-label">Draft</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-5">
                    <div class="stat-card scanning">
                        <div class="stat-number">{stats.scanning}</div>
                        <div class="stat-label">Scanning</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-5">
                    <div class="stat-card review">
                        <div class="stat-number">{stats.inReview}</div>
                        <div class="stat-label">In Review</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-5">
                    <div class="stat-card approved">
                        <div class="stat-number">{stats.approved}</div>
                        <div class="stat-label">Approved</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-5">
                    <div class="stat-card rejected">
                        <div class="stat-number">{stats.rejected}</div>
                        <div class="stat-label">Rejected</div>
                    </div>
                </div>
            </div>

            <!-- Use Case Table -->
            <template if:true={useCases.length}>
                <lightning-datatable
                    key-field="Id"
                    data={useCases}
                    columns={columns}
                    onrowaction={handleRowAction}
                    hide-checkbox-column>
                </lightning-datatable>
            </template>
            <template if:true={error}>
                <div class="slds-p-around_medium slds-text-color_error">
                    Error loading use cases. Please click Refresh.
                </div>
            </template>
            <template if:false={useCases.length}>
                <template if:false={error}>
                    <div class="slds-illustration slds-illustration_small slds-p-around_large slds-align_absolute-center">
                        <p class="slds-text-heading_medium slds-text-color_weak">No AI use cases filed yet</p>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-top_small">Go to Agent X-Ray to scan an Agentforce agent and begin filing</p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>

</template>
