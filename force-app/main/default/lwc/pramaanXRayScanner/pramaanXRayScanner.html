<template>
    <lightning-card title="Agent X-Ray" icon-name="standard:scan_card">
        <div class="slds-p-around_medium">
            <p class="slds-text-body_regular slds-m-bottom_medium">
                Deep-scan any Agentforce agent to generate its AI Bill of Materials, detect compliance flags, and surface platform warnings.
            </p>

            <!-- Agent Picker -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col slds-size_2-of-3">
                    <lightning-combobox
                        label="Select Agent to X-Ray"
                        value={selectedAgentId}
                        options={agentOptions}
                        onchange={handleAgentChange}
                        placeholder="Choose an Agentforce agent...">
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-3 slds-grid slds-grid_vertical-align-end">
                    <lightning-button
                        label="Run X-Ray"
                        variant="brand"
                        icon-name="utility:search"
                        onclick={runScan}
                        disabled={scanDisabled}>
                    </lightning-button>
                </div>
            </div>

            <!-- Loading -->
            <template if:true={isScanning}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Scanning..." size="medium"></lightning-spinner>
                    <p class="slds-m-left_medium">Running deep scan on agent configuration...</p>
                </div>
            </template>

            <!-- Results Dashboard -->
            <template if:true={scanResult}>
                <!-- Agent Identity Header -->
                <div class="slds-box slds-m-bottom_medium agent-header">
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <div class="slds-col">
                            <h2 class="slds-text-heading_medium">{scanResult.agentName}</h2>
                        </div>
                        <div class="slds-col slds-no-flex">
                            <span class="slds-badge slds-badge_inverse slds-m-right_x-small">Region: {scanResult.region}</span>
                            <span class="slds-badge slds-theme_success slds-m-right_x-small">{scanResult.modelProvider}</span>
                            <span class="slds-badge">{scanResult.scanDurationMs}ms</span>
                        </div>
                    </div>
                </div>

                <!-- BOM Stats Row -->
                <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-3 slds-p-around_xx-small">
                        <div class={topicsTileClass} data-tile="topics" onclick={handleBomTileClick}>
                            <div class="bom-number">{scanResult.topicCount}</div>
                            <div class="bom-label">Topics</div>
                            <template if:true={isTopicsExpanded}>
                                <div class="bom-expand-hint">&#9650;</div>
                            </template>
                            <template if:false={isTopicsExpanded}>
                                <div class="bom-expand-hint">&#9660;</div>
                            </template>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-p-around_xx-small">
                        <div class={actionsTileClass} data-tile="actions" onclick={handleBomTileClick}>
                            <div class="bom-number">{scanResult.actionCount}</div>
                            <div class="bom-label">Actions</div>
                            <template if:true={isActionsExpanded}>
                                <div class="bom-expand-hint">&#9650;</div>
                            </template>
                            <template if:false={isActionsExpanded}>
                                <div class="bom-expand-hint">&#9660;</div>
                            </template>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3 slds-p-around_xx-small">
                        <div class="bom-card">
                            <div class="bom-number">{inRegionLabel}</div>
                            <div class="bom-label">In-Region</div>
                        </div>
                    </div>
                </div>

                <!-- Topics Detail Panel -->
                <template if:true={isTopicsExpanded}>
                    <div class="slds-box slds-m-bottom_medium bom-detail-panel">
                        <h4 class="slds-text-heading_small slds-m-bottom_small">
                            <lightning-icon icon-name="utility:topic2" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            Agent Topics
                        </h4>
                        <template if:true={hasTopics}>
                            <template for:each={topicsList} for:item="topic">
                                <div key={topic.name} class="bom-detail-row">
                                    <div class="slds-grid slds-grid_vertical-align-start">
                                        <div class="slds-col slds-grow">
                                            <div class="slds-text-body_regular"><strong>{topic.name}</strong></div>
                                            <template if:true={topic.description}>
                                                <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">{topic.description}</div>
                                            </template>
                                            <template if:true={topic.scope}>
                                                <div class="slds-text-body_small slds-m-top_xx-small">
                                                    <span class="slds-badge slds-badge_lightest">Instructions</span>
                                                    <span class="slds-m-left_xx-small">{topic.scope}</span>
                                                </div>
                                            </template>
                                            <template if:true={topic.hasActions}>
                                                <div class="slds-text-body_small slds-m-top_xx-small">
                                                    <span class="slds-text-color_weak">Actions: </span>{topic.actionNamesStr}
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template if:false={hasTopics}>
                            <div class="slds-text-body_small slds-text-color_weak slds-p-around_small">No topics found for this agent.</div>
                        </template>
                    </div>
                </template>

                <!-- Actions Detail Panel -->
                <template if:true={isActionsExpanded}>
                    <div class="slds-box slds-m-bottom_medium bom-detail-panel">
                        <h4 class="slds-text-heading_small slds-m-bottom_small">
                            <lightning-icon icon-name="utility:flow" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            Agent Actions
                        </h4>
                        <template if:true={hasActions}>
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_striped">
                                <thead>
                                    <tr>
                                        <th>Action Name</th>
                                        <th>Type</th>
                                        <th>Target</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={actionsList} for:item="action">
                                        <tr key={action.name}>
                                            <td class="slds-text-body_small"><strong>{action.name}</strong></td>
                                            <td class="slds-text-body_small">{action.actionType}</td>
                                            <td class="slds-text-body_small">{action.targetReference}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:false={hasActions}>
                            <div class="slds-text-body_small slds-text-color_weak slds-p-around_small">No actions found for this agent.</div>
                        </template>
                    </div>
                </template>

                <!-- Data Touches Detail Panel -->
                <template if:true={isDataExpanded}>
                    <div class="slds-box slds-m-bottom_medium bom-detail-panel">
                        <h4 class="slds-text-heading_small slds-m-bottom_small">
                            <lightning-icon icon-name="utility:database" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            Data Touches
                        </h4>
                        <template if:true={hasDataTouches}>
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_striped">
                                <thead>
                                    <tr>
                                        <th>Object</th>
                                        <th>Field</th>
                                        <th>Access</th>
                                        <th>Classification</th>
                                        <th>Flags</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={dataTouchesList} for:item="dt">
                                        <tr key={dt.key}>
                                            <td class="slds-text-body_small">{dt.objectName}</td>
                                            <td class="slds-text-body_small"><strong>{dt.fieldName}</strong></td>
                                            <td class="slds-text-body_small">{dt.accessType}</td>
                                            <td class="slds-text-body_small">{dt.securityClassification}</td>
                                            <td>
                                                <template if:true={dt.isPII}><span class="slds-badge slds-theme_warning slds-m-right_xx-small">PII</span></template>
                                                <template if:true={dt.isFinancial}><span class="slds-badge slds-theme_warning slds-m-right_xx-small">Financial</span></template>
                                                <template if:true={dt.isAadhaar}><span class="slds-badge slds-theme_error">Aadhaar</span></template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:false={hasDataTouches}>
                            <div class="slds-text-body_small slds-text-color_weak slds-p-around_small">No data touch points found.</div>
                        </template>
                    </div>
                </template>

                <!-- Compliance Flags -->
                <h3 class="slds-text-heading_small slds-m-bottom_small slds-m-top_medium">Compliance Flags</h3>
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-3">
                        <div class={piiClass}>
                            <lightning-icon icon-name={piiIcon} size="x-small"></lightning-icon>
                            <span class="slds-m-left_x-small">{piiLabel}</span>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class={financialClass}>
                            <lightning-icon icon-name={financialIcon} size="x-small"></lightning-icon>
                            <span class="slds-m-left_x-small">{financialLabel}</span>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class={regionClass}>
                            <lightning-icon icon-name={regionIcon} size="x-small"></lightning-icon>
                            <span class="slds-m-left_x-small">{regionLabel}</span>
                        </div>
                    </div>
                </div>

                <!-- Platform Health Checks (Prizm-style) -->
                <h3 class="slds-text-heading_small slds-m-bottom_small slds-m-top_medium">Platform Health Checks</h3>
                <div class="slds-box slds-m-bottom_medium health-panel">
                    <template for:each={healthChecks} for:item="check">
                        <div key={check.id} class={check.rowClass}>
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon icon-name={check.icon} size="x-small" class="slds-m-right_small"></lightning-icon>
                                <div class="slds-col">
                                    <span class="slds-text-body_regular"><strong>{check.label}</strong></span>
                                    <span class="slds-text-body_small slds-text-color_weak slds-m-left_small">{check.detail}</span>
                                </div>
                                <div class="slds-col slds-no-flex">
                                    <span class={check.badgeClass}>{check.status}</span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Code Security Scan Results -->
                <template if:true={hasCodeScan}>
                    <h3 class="slds-text-heading_small slds-m-bottom_small slds-m-top_medium">Code Security Scan</h3>
                    <div class="slds-box slds-m-bottom_medium code-scan-panel">
                        <!-- Scan Status Header -->
                        <div class={codeScanStatusClass}>
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon
                                    icon-name={codeScanIcon}
                                    size="small"
                                    class="slds-m-right_small">
                                </lightning-icon>
                                <div class="slds-col">
                                    <strong>{codeScanStatusLabel}</strong>
                                    <template if:false={codeScanClean}>
                                        <span class="slds-m-left_small slds-text-body_small">
                                            (Critical: {codeScanResult.criticalCount} | High: {codeScanResult.highCount} | Medium: {codeScanResult.mediumCount} | Low: {codeScanResult.lowCount})
                                        </span>
                                    </template>
                                </div>
                            </div>
                        </div>

                        <!-- Scan Tools (clickable) -->
                        <div class="slds-grid slds-gutters slds-wrap slds-p-around_small">
                            <template for:each={codeScanResult.tools} for:item="tool">
                                <div key={tool.name} class="slds-col slds-size_1-of-4 slds-p-around_xx-small">
                                    <div class={tool.cardClass} data-tool={tool.name} onclick={handleToolClick}>
                                        <div class="slds-grid slds-grid_vertical-align-center">
                                            <lightning-icon icon-name={tool.icon} size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                            <span class="slds-text-body_small"><strong>{tool.name}</strong></span>
                                        </div>
                                        <div class="slds-grid slds-m-top_xx-small">
                                            <span class={tool.toolClass}>{tool.status}</span>
                                            <span class="slds-text-body_small slds-text-color_weak slds-m-left_xx-small">{tool.findings} findings</span>
                                        </div>
                                        <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Last: {tool.lastRun}</div>
                                        <template if:true={tool.isSelected}>
                                            <div class="scan-tool-indicator">&#9660; Selected</div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Filtered Findings Detail (shown on tool click) -->
                        <template if:true={showFindingsTable}>
                            <div class="slds-p-horizontal_small slds-p-bottom_small">
                                <div class="scan-filter-header">
                                    <lightning-icon icon-name="utility:filterList" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                                    Showing findings for: <strong>{selectedToolLabel}</strong>
                                </div>
                                <template if:true={hasFilteredFindings}>
                                    <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_striped">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Severity</th>
                                                <th>Description</th>
                                                <th>Location</th>
                                                <th>Developer</th>
                                                <th>Status</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={filteredFindings} for:item="finding">
                                                <tr key={finding.id}>
                                                    <td class="slds-text-body_small"><strong>{finding.id}</strong></td>
                                                    <td><span class={finding.severityClass}>{finding.severity}</span></td>
                                                    <td class="slds-text-body_small">{finding.description}</td>
                                                    <td class="slds-text-body_small">{finding.file}:{finding.lineNumber}</td>
                                                    <td class="slds-text-body_small">{finding.developer}</td>
                                                    <td><span class={finding.statusClass}>{finding.status}</span></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>
                                <template if:false={hasFilteredFindings}>
                                    <div class="scan-no-findings">
                                        <lightning-icon icon-name="utility:success" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        No findings from this tool — all clear.
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Save & Continue -->
                <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                    <lightning-button
                        label="Save Snapshot & Continue to Risk Assessment"
                        variant="brand"
                        icon-name="utility:forward"
                        icon-position="right"
                        onclick={saveAndContinue}>
                    </lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
