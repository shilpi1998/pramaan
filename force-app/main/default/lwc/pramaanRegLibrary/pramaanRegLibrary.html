<template>
    <lightning-card title="Regulation Library" icon-name="standard:education">
        <div class="slds-p-around_medium">
            <!-- Summary Stats -->
            <div class="slds-grid slds-gutters slds-m-bottom_large">
                <div class="slds-col slds-size_1-of-3">
                    <div class="summary-card">
                        <div class="summary-number">{totalRegulators}</div>
                        <div class="summary-label">Indian Regulators</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <div class="summary-card">
                        <div class="summary-number">{totalClauses}</div>
                        <div class="summary-label">Compliance Clauses</div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <div class="summary-card">
                        <div class="summary-number">4</div>
                        <div class="summary-label">Sectors Covered</div>
                    </div>
                </div>
            </div>

            <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_medium">
                Pramaan evaluates AI agents against these Indian regulatory frameworks. Click a regulator card to explore its coverage.
            </p>

            <!-- Regulator Cards Grid -->
            <div class="slds-grid slds-wrap slds-gutters">
                <template for:each={regulatorCards} for:item="reg">
                    <div key={reg.key} class="slds-col slds-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_medium">
                        <div class={reg.cardClass} data-key={reg.key} onclick={handleCardClick}>
                            <div class="reg-card-header">
                                <lightning-icon icon-name={reg.icon} size="small" class="slds-m-right_x-small"></lightning-icon>
                                <span class="reg-name">{reg.name}</span>
                                <span class="reg-clause-badge">{reg.clauses} clauses</span>
                            </div>
                            <div class="reg-fullname">{reg.fullName}</div>
                            <div class="reg-focus">{reg.focus}</div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Detail Panel -->
            <template if:true={hasSelection}>
                <div class="detail-panel slds-m-top_medium">
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                        <h2 class="slds-text-heading_medium">{selectedReg.fullName} ({selectedReg.name})</h2>
                        <lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={handleCloseDetail}></lightning-button-icon>
                    </div>
                    <p class="slds-text-body_regular slds-m-bottom_medium">{selectedReg.description}</p>

                    <div class="slds-grid slds-gutters slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-2">
                            <h3 class="slds-text-title_caps slds-m-bottom_x-small">Key Regulations</h3>
                            <ul class="slds-list_dotted">
                                <template for:each={selectedReg.regulations} for:item="r">
                                    <li key={r}>{r}</li>
                                </template>
                            </ul>
                        </div>
                        <div class="slds-col slds-size_1-of-2">
                            <h3 class="slds-text-title_caps slds-m-bottom_x-small">Applies To</h3>
                            <p class="slds-text-body_regular">{selectedReg.appliesTo}</p>

                            <h3 class="slds-text-title_caps slds-m-top_medium slds-m-bottom_x-small">Clauses in Pramaan</h3>
                            <div class="clause-count-large">{selectedReg.clauses}</div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
