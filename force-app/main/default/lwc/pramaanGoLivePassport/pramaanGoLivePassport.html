<template>
    <div class="pp-wrapper">
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading passport..." size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:true={hasPassport}>
                <div class="pp-card">
                    <!-- Status Banner -->
                    <div class={statusBannerClass}>
                        <template if:true={isPassed}>
                            <lightning-icon icon-name="utility:check" size="xx-small" class="pp-banner-icon"></lightning-icon>
                        </template>
                        <template if:false={isPassed}>
                            <lightning-icon icon-name="utility:clock" size="xx-small" class="pp-banner-icon"></lightning-icon>
                        </template>
                        <span>{statusLabel}</span>
                    </div>

                    <!-- Header -->
                    <div class="pp-header">
                        <div class="pp-header-top">
                            <div class="pp-org-label">AI GOVERNANCE COMPLIANCE PASSPORT</div>
                            <span class={riskTierClass}>{riskTier} Risk</span>
                        </div>
                        <h2 class="pp-agent-name">{agentName}</h2>
                        <template if:true={hasPassportNumber}>
                            <div class="pp-passport-num">{passport.Passport_Number__c}</div>
                        </template>
                    </div>

                    <!-- Summary -->
                    <div class="pp-summary">
                        <p>{passportSummary}</p>
                    </div>

                    <!-- Stats Row -->
                    <div class="pp-stats">
                        <div class="pp-stat">
                            <div class="pp-stat-num">{approvedCount}/{totalGates}</div>
                            <div class="pp-stat-label">Gates Cleared</div>
                        </div>
                        <div class="pp-stat">
                            <div class="pp-stat-num">{clausesMet}/{clausesTotal}</div>
                            <div class="pp-stat-label">Clauses Met</div>
                        </div>
                        <div class="pp-stat">
                            <div class="pp-stat-num">{totalEvents}</div>
                            <div class="pp-stat-label">Audit Events</div>
                        </div>
                    </div>

                    <!-- Gate Approvals -->
                    <div class="pp-gates">
                        <div class="pp-gates-title">Governance Gate Sign-Off</div>
                        <template for:each={gatesList} for:item="gate">
                            <div key={gate.id} class={gate.rowClass}>
                                <lightning-icon icon-name={gate.icon} size="xx-small" class="pp-gate-icon"></lightning-icon>
                                <span class="pp-gate-lens">{gate.lens}</span>
                                <template if:true={gate.isApproved}>
                                    <span class="pp-gate-reviewer">{gate.reviewer}</span>
                                    <span class="pp-gate-date">{gate.date}</span>
                                </template>
                                <template if:false={gate.isApproved}>
                                    <span class="pp-gate-pending-label">Pending</span>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- Chain Verification -->
                    <div class="pp-chain">
                        <template if:true={chainVerified}>
                            <div class="pp-chain-ok">
                                <lightning-icon icon-name="utility:shield" size="xx-small" class="pp-chain-icon"></lightning-icon>
                                Audit chain integrity verified — {totalEvents} events, tamper-free
                            </div>
                        </template>
                        <template if:false={chainVerified}>
                            <div class="pp-chain-warn">
                                <lightning-icon icon-name="utility:warning" size="xx-small" class="pp-chain-icon"></lightning-icon>
                                Audit chain not yet verified
                            </div>
                        </template>
                    </div>

                    <!-- Case Summary Ticket -->
                    <div class="pp-case-ticket">
                        <div class="pp-case-ticket-header">
                            <div class="pp-case-ticket-title-row">
                                <lightning-icon icon-name="standard:case_wrap_up" size="x-small" class="pp-case-ticket-icon"></lightning-icon>
                                <span class="pp-case-ticket-title">Case Brief</span>
                            </div>
                            <span class={caseTicketStatusClass}>{caseTicketStatusLabel}</span>
                        </div>
                        <div class="pp-case-ticket-body">
                            <p class="pp-case-ticket-text">{caseBriefText}</p>
                        </div>
                        <div class="pp-case-ticket-meta">
                            <div class="pp-case-meta-item">
                                <span class="pp-case-meta-label">Regulations Covered</span>
                                <span class="pp-case-meta-value">RBI IT Governance &middot; DPDP Act 2023 &middot; CERT-In &middot; RBI KYC Directions</span>
                            </div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="pp-footer">
                        <template if:true={issuedDate}>
                            <div class="pp-footer-line">Issued: {issuedDate}</div>
                        </template>
                        <template if:true={hasConfigHash}>
                            <div class="pp-footer-hash">SHA-256: {configHash}</div>
                        </template>
                        <div class="pp-footer-brand">Pramaan &mdash; Proof, Not Paperwork</div>
                    </div>
                </div>
            </template>

            <template if:false={hasPassport}>
                <div class="pp-empty">
                    <lightning-icon icon-name="utility:lock" size="large" class="pp-empty-icon"></lightning-icon>
                    <h3 class="pp-empty-title">Passport Not Yet Issued</h3>
                    <p class="pp-empty-text">All review gates must be approved before a compliance passport can be issued for this agent.</p>
                </div>
            </template>
        </template>
    </div>
</template>
