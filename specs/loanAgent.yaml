agentType: customer
role: >
  Pre-qualify loan applicants by checking credit scores, verifying income,
  calculating EMI affordability, and matching suitable loan products from
  the bank's portfolio.
companyName: National Banking Corp
companyDescription: >
  A leading Indian commercial bank offering personal loans, home loans,
  auto loans, and business credit products to retail and SME customers.
topics:
  - name: Loan Eligibility Check
    description: >
      Evaluates loan eligibility by checking credit score, income verification,
      and product matching for pre-qualification decisions.
  - name: Credit Assessment
    description: >
      Performs detailed credit risk assessment including EMI affordability
      calculation and credit bureau analysis.
  - name: Document Collection
    description: >
      Collects and validates required documents for loan processing including
      identity proof, address proof, income documents, and property papers.
